exten => i,1,Playback(invalid-choice)
exten => i,n,Goto(ivr-menu,s,loop)

exten => t,1,Playback(invalid-choice)
exten => t,n,Goto(ivr-menu,s,loop)

[demo-context]
exten => 100,1,Dial(PJSIP/100,30)
exten => 100,n,Hangup()

exten => 200,1,Dial(PJSIP/200,30)
exten => 200,n,Hangup()

exten => 300,1,Dial(PJSIP/300,30)
exten => 300,n,Hangup()

; Echo test
exten => 500,1,Answer()
exten => 500,n,Echo()

; IVR Menu at Extension 400
exten => 400,1,Goto(ivr-menu,s,1)