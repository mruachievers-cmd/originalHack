[ivr-menu]
exten => s,1,Answer()
exten => s,n,Set(TIMEOUT(digit)=5)
exten => s,n,Set(TIMEOUT(response)=10)
exten => s,n(loop),Background(main-menu)
exten => s,n,WaitExten(10)

exten => 1,1,Playback(dialpad-guide)
exten => 1,n,Goto(ivr-menu,s,loop)

exten => 2,1,Playback(fir-details)
exten => 2,n,Goto(ivr-menu,s,loop)

exten => 3,1,Playback(calling-constable)
exten => 3,n,Dial(PJSIP/200,60)
